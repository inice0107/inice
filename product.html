<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>产品详情 — InIce</title>
  <meta name="description" content="InIce 产品详情">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;600;700&family=Noto+Sans+SC:wght@300;400;500&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .product-detail {
      padding-top: 80px;
      background: var(--bg-white);
      min-height: 100vh;
    }
    .product-detail-inner {
      max-width: 1000px;
      margin: 0 auto;
      padding: 3rem 2rem 6rem;
    }
    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      margin-bottom: 2rem;
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.3s;
    }
    .back-link:hover { color: var(--text-primary); }

    .product-detail-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4rem;
      align-items: start;
    }
    .product-detail-image {
      position: sticky;
      top: 100px;
    }
    .product-detail-image img {
      width: 100%;
      display: block;
      border: 1px solid var(--border-light);
    }
    .product-detail-chakra {
      font-family: 'Cormorant Garamond', serif;
      font-size: 0.7rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--accent-gold);
      margin-bottom: 1rem;
    }
    .product-detail-name {
      font-family: 'Noto Serif SC', serif;
      font-size: 2rem;
      font-weight: 400;
      letter-spacing: 0.1em;
      color: var(--text-primary);
      margin-bottom: 0.3rem;
    }
    .product-detail-name-en {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.3rem;
      font-style: italic;
      color: var(--text-muted);
      margin-bottom: 2.5rem;
    }

    .detail-block {
      margin-bottom: 2.5rem;
    }
    .detail-block-label {
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--accent-gold);
      margin-bottom: 1rem;
      display: flex;
      align-items: center;
      gap: 0.8rem;
    }
    .detail-block-label::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border-light);
    }
    .detail-note {
      font-family: 'Noto Serif SC', serif;
      font-size: 0.95rem;
      line-height: 2.2;
      color: var(--text-secondary);
      letter-spacing: 0.05em;
    }
    .detail-ingredients {
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
    }
    .detail-ingredient {
      padding: 0.5rem 1rem;
      background: var(--bg-cream);
      border: 1px solid var(--border-light);
      font-size: 0.8rem;
      letter-spacing: 0.05em;
      color: var(--text-secondary);
    }

    .detail-buy-section {
      margin-top: 3rem;
      padding-top: 2rem;
      border-top: 1px solid var(--border-light);
    }
    .detail-buy {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 1rem 2.5rem;
      background: var(--text-primary);
      color: var(--bg-cream);
      text-decoration: none;
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      border: 1px solid var(--text-primary);
      transition: all var(--transition-fast);
    }
    .detail-buy:hover {
      background: transparent;
      color: var(--text-primary);
    }
    .detail-buy-note {
      margin-top: 1rem;
      font-size: 0.75rem;
      color: var(--text-muted);
      letter-spacing: 0.05em;
    }

    .not-found {
      text-align: center;
      padding: 10rem 2rem;
    }
    .not-found h2 {
      font-family: 'Noto Serif SC', serif;
      font-size: 1.5rem;
      font-weight: 400;
      letter-spacing: 0.1em;
      margin-bottom: 1rem;
    }
    .not-found p {
      color: var(--text-muted);
      margin-bottom: 2rem;
    }

    @media (max-width: 800px) {
      .product-detail-grid {
        grid-template-columns: 1fr;
        gap: 2rem;
      }
      .product-detail-image {
        position: static;
        max-width: 400px;
        margin: 0 auto;
      }
    }
  </style>
</head>
<body>
  <div class="page-transition"></div>
  <div id="loading">
    <div class="loading-content">
      <div class="loading-brand">In<span style="font-style:italic">I</span>ce</div>
      <div class="loading-line"></div>
      <div class="loading-sub">世界本喧 · 此处冰点</div>
    </div>
  </div>

  <nav id="navbar">
    <a href="./index.html" class="nav-brand">In<span style="font-style:italic">I</span>ce</a>
    <ul class="nav-links">
      <li><a href="./index.html">首页</a></li>
      <li><a href="./products.html">产品</a></li>
      <li><a href="./about.html">关于</a></li>
      <li><a href="./contact.html">联络</a></li>
    </ul>
    <button class="mobile-menu-btn" aria-label="菜单">
      <span></span><span></span><span></span>
    </button>
  </nav>
  <div class="mobile-menu">
    <a href="./index.html">首页</a>
    <a href="./products.html">产品</a>
    <a href="./about.html">关于</a>
    <a href="./contact.html">联络</a>
  </div>

  <section class="product-detail">
    <div class="product-detail-inner">
      <a href="./chakras.html" class="back-link" id="backLink">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
        返回产品列表
      </a>

      <div class="product-detail-grid" id="productContent">
        <!-- JS will populate this -->
      </div>

      <div class="not-found" id="notFound" style="display:none;">
        <h2>产品未找到</h2>
        <p>抱歉，该产品不存在或已被移除。</p>
        <a href="./products.html" class="detail-buy">返回产品系列</a>
      </div>
    </div>
  </section>

  <footer>
    <p class="footer-brand">In<span style="font-style:italic">I</span>ce</p>
    <p class="footer-slogan">世界本喧，此处冰点</p>
    <div class="footer-line"></div>
    <div class="footer-links">
      <a href="./index.html">首页</a>
      <a href="./products.html">产品</a>
      <a href="./about.html">关于</a>
      <a href="./contact.html">联络</a>
    </div>
    <p class="footer-copy">© 2025 InIce. All rights reserved.</p>
  </footer>

  <script src="js/main.js"></script>
  <script>
    const productData = {
      frankincense: {
        name: '乳香',
        nameEn: 'Frankincense',
        chakra: 'Sahasrara · 顶轮 / 火 · 静心之香',
        image: 'images/new-frankincense.jpeg',
        note: '是教堂穹顶下那缕笔直的烟，圣经里也写：那是神明在低处驻足的样子。阿曼与也门的乳香树脂，木质里带一点淡果香，醇厚而肃穆——它没有甜，没有凉，只剩一种极薄的"在"。像午睡醒来窗帘透出的光，你还什么都没想，世界已经变轻了。留三十分钟，给不说话的自己。',
        ingredients: ['阿曼乳香树脂', '也门乳香精油', '喜马拉雅天然草本']
      },
      myrrh: {
        name: '没药',
        nameEn: 'Myrrh',
        chakra: 'Crown · 顶轮 · 沉淀之香',
        image: 'images/new-myrrh.jpeg',
        note: '是旧木柜深处那包蜡纸裹着的深红褐色树脂，打开时扑面而来的温润与微苦——木乃伊裹身、寺庙开光，古人用它封存时间。阿曼与索马里的没药，气味不讨喜，却压得住场：苦在前，甘在后，像一封读到最后才读懂的信。每次闻，身体里某处都被轻轻按下。给容易想太多的你。',
        ingredients: ['阿曼没药树脂', '索马里没药树脂', '没药精油']
      },
      naswa: {
        name: '那瓦',
        nameEn: 'Na Swa',
        chakra: 'Mu · 木 / 眉心轮 · 内观之香',
        image: 'images/new-naswa.jpeg',
        note: '是高山草甸下过雨之后，甘松把根茎的苦香从土里顶出来，竹柏与娑罗双树的青气浮在上层，肉豆蔻与红花添一笔暖，没药在末尾收暗。七种草本——这不是一支香，是一座藏地的坛城。关上门，闭上眼，三十分钟后你会觉得自己是干净的。给特别疲倦、特别想"清零"的日子。',
        ingredients: ['甘松', '竹柏', '娑罗双树', '肉豆蔻', '红花', '没药']
      },
      sandalwood: {
        name: '檀香',
        nameEn: 'Sandalwood',
        chakra: 'Anahata · 心轮 / 土 · 流动之香',
        image: 'images/new-sandalwood.jpeg',
        note: '是老街尽头那家木匠铺，印度老山檀香的刨花落在地上，散出温厚的奶甜木香，茉莉与圣罗勒在中段落一点白，雪松、肉豆蔻与小豆蔻收住尾韵。它像一位从不多言的师友——你说话时它不抢，你停下时它还在。也许你不需要答案，你需要一支香的安静。给深夜还在纠结选哪条路的人。',
        ingredients: ['老山檀香', '茉莉', '圣罗勒', '雪松', '肉豆蔻', '小豆蔻']
      },
      nagchampa: {
        name: '金香木',
        nameEn: 'Nag Champa',
        chakra: 'Svadhisthana · 生殖轮 / 心轮 · 被爱之香',
        image: 'images/new-nagchampa.jpeg',
        note: '是寺庙墙角那株黄兰花开到最盛的午后，甜香被太阳晒得发暖，鸡蛋花的奶香落在石阶上，檀香基底在暗处稳稳接住。它把"南亚的傍晚"点着了——甜，但甜得不腻；温，但温得不糊，像一件穿过很多次的棉麻衣，上面是你最熟悉的气味。给很久没好好对待自己的你。',
        ingredients: ['黄兰花', '鸡蛋花', '印度绿叶香', '檀香']
      },
      dorjee: {
        name: '多吉',
        nameEn: 'Dorjee',
        chakra: 'Jin · 金 / 太阳神经丛 · 底气之香',
        image: 'images/new-dorjee.jpeg',
        note: '是藏地清晨的甜茶馆，丁香的辛、肉桂的暖在铜壶边碰出一点火星，缬草在底下稳稳托住。"多吉"在藏语里意为"金刚"——不破的那种。它不是温柔的香，是有重力的香，初燃锋利，燃到中段反而温厚，像一只无形的手按在胃上说：别怕。给要自己撑过一天的早上。',
        ingredients: ['丁香', '肉桂', '缬草', '多种木质调']
      },
      citronella: {
        name: '香茅',
        nameEn: 'Citronella',
        chakra: 'Shui · 水 / 喉轮 · 清言之香',
        image: 'images/new-citronella.jpeg',
        note: '是雨季来临前的傍晚，屋檐下挂着的香茅被风吹得一阵阵地凉。尼泊尔与斯里兰卡的香茅精油，气味是绿色的——清亮、微酸，像切开一颗青柠时溅出的汁水，哗地一下，像夏天午后突然进来的穿堂风。它不似香水精致，却能把闷热和混沌一起推远。给一觉醒来还累、盯着屏幕发呆的你。',
        ingredients: ['尼泊尔香茅精油', '斯里兰卡香茅精油']
      },
      austha: {
        name: '奥斯塔',
        nameEn: 'Austha Suganda',
        chakra: 'Ajna · 眉心轮 / 太阳神经丛 · 自我之香',
        image: 'images/new-austha.jpeg',
        note: '是番红花在温水里缓缓散开的那个黄昏，甜暖漫过整间屋子——古代价比黄金的香料，气味不是"贵"，是"远"。缬草从泥土深处翻上安静，甘草收一个悠长的回甘。闻着像见到一位活得很笃定的人，不张扬，但你信他。给觉得自己"不够亮"的下午。',
        ingredients: ['番红花', '缬草', '甘草']
      },
      devdar: {
        name: '神木',
        nameEn: 'Devdar',
        chakra: 'Muladhara · 海底轮 · 扎根之香',
        image: 'images/new-devdar.jpeg',
        note: '是喜马拉雅雪线之下那棵站了几百年的雪松，风穿过针叶时带下来的清冽木香。Devdar 在梵语里就是"神木"，寺庙的梁、山民的火塘，都是它的去处。闻它的时候，身体先于大脑做出反应：肩膀松了，脚踩实了。你不必去山里，一支雪松也能把你接回地面。给晚上睡不着、白天醒不过来的人。',
        ingredients: ['喜马拉雅雪松精油']
      },
      cedar: {
        name: '喜马拉雅雪松',
        nameEn: 'Himalayan Cedar',
        chakra: 'Muladhara · 海底轮 · 沉稳之香',
        image: 'images/new-cedar.jpeg',
        note: '是登山者夜里借宿的山间木屋，炉膛里雪松燃出的干燥暖香，混着门外雪的气味。比"神木"更深一寸的雪松——神木让你落地，它让你坐在地上不着急起来。醇厚的木质香笔直地燃，不帮任何忙，但闻过的人都说：心里那根线，不抖了。给想慢下来的人。',
        ingredients: ['喜马拉雅雪松', '天然草本']
      }
    };

    const params = new URLSearchParams(window.location.search);
    const productKey = params.get('p');
    const product = productData[productKey];

    if (!product) {
      document.getElementById('productContent').style.display = 'none';
      document.getElementById('notFound').style.display = 'block';
      document.getElementById('backLink').style.display = 'none';
    } else {
      document.title = `${product.name} — InIce`;
      document.querySelector('meta[name="description"]').content = `${product.name} ${product.nameEn} — ${product.chakra}`;

      // Determine back link
      const backLink = document.getElementById('backLink');
      if (productKey === 'frankincense' || productKey === 'myrrh' || productKey === 'naswa' || productKey === 'sandalwood' || productKey === 'nagchampa' || productKey === 'dorjee' || productKey === 'citronella' || productKey === 'austha' || productKey === 'devdar' || productKey === 'cedar') {
        // All are in chakras, but some are also in elements
        if (['naswa', 'frankincense', 'sandalwood', 'dorjee', 'citronella'].includes(productKey)) {
          backLink.href = './elements.html';
          backLink.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M19 12H5M12 19l-7-7 7-7"/></svg> 返回五行系列`;
        } else {
          backLink.href = './chakras.html';
          backLink.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="14" height="14"><path d="M19 12H5M12 19l-7-7 7-7"/></svg> 返回七脉轮系列`;
        }
      }

      document.getElementById('productContent').innerHTML = `
        <div class="product-detail-image reveal visible">
          <img src="${product.image}" alt="${product.name}">
        </div>
        <div class="product-detail-info reveal visible reveal-delay-1">
          <p class="product-detail-chakra">${product.chakra}</p>
          <h1 class="product-detail-name">${product.name}</h1>
          <p class="product-detail-name-en">${product.nameEn}</p>

          <div class="detail-block">
            <p class="detail-block-label">Perfumer's Note · 用香手记</p>
            <p class="detail-note">${product.note}</p>
          </div>

          <div class="detail-block">
            <p class="detail-block-label">Ingredients · 原料</p>
            <div class="detail-ingredients">
              ${product.ingredients.map(i => `<span class="detail-ingredient">${i}</span>`).join('')}
            </div>
          </div>

          <div class="detail-buy-section">
            <a href="https://www.xiaohongshu.com/user/profile/26537117029" target="_blank" class="detail-buy">
              <svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
              前往小红书购买
            </a>
            <p class="detail-buy-note">点击跳转至 InIce 小红书主页</p>
          </div>
        </div>
      `;
    }
  </script>
</body>
</html>
