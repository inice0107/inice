<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #FDFCFA;
  font-family: "Noto Serif SC", "PingFang SC", serif;
  width: 1200px;
  height: 600px;
  display: flex;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}
.content {
  text-align: center;
}
.content .brand {
  font-size: 84px;
  letter-spacing: 20px;
  color: #2C2C2C;
  font-family: "Cormorant Garamond", serif;
  font-weight: 300;
}
.content .line {
  width: 80px;
  height: 1px;
  background: #C4A882;
  margin: 40px auto;
}
.content .slogan {
  font-size: 32px;
  color: #5A5A5A;
  letter-spacing: 8px;
}
.content .slogan-en {
  font-size: 24px;
  color: #999;
  margin-top: 16px;
  letter-spacing: 4px;
  font-family: "Cormorant Garamond", serif;
  font-style: italic;
}
.side-deco {
  position: absolute;
  right: 120px;
  top: 50%;
  transform: translateY(-50%);
  writing-mode: vertical-rl;
  font-size: 22px;
  color: #C4A882;
  letter-spacing: 8px;
}
</style>
</head>
<body>
<div class="content">
  <div class="brand">InIce</div>
  <div class="line"></div>
  <div class="slogan">世界本喧，此处冰点</div>
  <div class="slogan-en">where noise dissolves into stillness</div>
</div>
<div class="side-deco">尼泊尔手工线香</div>
</body>
</html>
