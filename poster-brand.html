<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #F7F3EC;
  font-family: "Noto Serif SC", "PingFang SC", serif;
  width: 1080px;
  height: 1080px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  position: relative;
  overflow: hidden;
}
.deco-line-top {
  position: absolute;
  top: 160px;
  left: 50%;
  transform: translateX(-50%);
  width: 1px;
  height: 120px;
  background: #C4A882;
}
.brand-name {
  font-size: 112px;
  font-weight: 300;
  letter-spacing: 24px;
  color: #2C2C2C;
  font-family: "Cormorant Garamond", serif;
}
.slogan-zh {
  font-size: 36px;
  color: #5A5A5A;
  letter-spacing: 12px;
  margin-top: 48px;
  font-weight: 400;
}
.slogan-en {
  font-size: 26px;
  color: #999;
  letter-spacing: 4px;
  margin-top: 24px;
  font-family: "Cormorant Garamond", serif;
  font-style: italic;
}
.deco-line-bottom {
  position: absolute;
  bottom: 200px;
  left: 50%;
  transform: translateX(-50%);
  width: 1px;
  height: 80px;
  background: #C4A882;
}
.category {
  position: absolute;
  bottom: 120px;
  font-size: 22px;
  color: #C4A882;
  letter-spacing: 8px;
}
</style>
</head>
<body>
<div class="deco-line-top"></div>
<div class="brand-name">InIce</div>
<div class="slogan-zh">世界本喧，此处冰点</div>
<div class="slogan-en">where noise dissolves into stillness</div>
<div class="deco-line-bottom"></div>
<div class="category">尼泊尔手工线香</div>
</body>
</html>
