<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #F7F3EC;
  font-family: "Noto Serif SC", "PingFang SC", serif;
  width: 1080px;
  height: 1920px;
  position: relative;
  overflow: hidden;
}
.top-line {
  position: absolute;
  top: 120px;
  left: 50%;
  transform: translateX(-50%);
  width: 1px;
  height: 80px;
  background: #C4A882;
}
.product-name {
  position: absolute;
  top: 240px;
  left: 0;
  right: 0;
  text-align: center;
}
.product-name h1 {
  font-size: 56px;
  color: #2C2C2C;
  letter-spacing: 12px;
  font-weight: 500;
}
.product-name .en {
  font-size: 28px;
  color: #999;
  margin-top: 16px;
  letter-spacing: 4px;
  font-family: "Cormorant Garamond", serif;
}
.divider {
  position: absolute;
  top: 420px;
  left: 50%;
  transform: translateX(-50%);
  width: 60px;
  height: 1px;
  background: #C4A882;
}
.desc {
  position: absolute;
  top: 480px;
  left: 100px;
  right: 100px;
  text-align: center;
}
.desc p {
  font-size: 28px;
  color: #5A5A5A;
  line-height: 2.2;
  letter-spacing: 2px;
  margin-bottom: 8px;
}
.scent-note {
  position: absolute;
  top: 840px;
  left: 0;
  right: 0;
  text-align: center;
}
.scent-note .label {
  font-size: 22px;
  color: #C4A882;
  letter-spacing: 6px;
  margin-bottom: 24px;
}
.scent-note .notes {
  font-size: 26px;
  color: #2C2C2C;
  letter-spacing: 3px;
}
.bottom-brand {
  position: absolute;
  bottom: 120px;
  left: 0;
  right: 0;
  text-align: center;
}
.bottom-brand .logo {
  font-size: 40px;
  letter-spacing: 12px;
  color: #2C2C2C;
  font-family: "Cormorant Garamond", serif;
}
.bottom-brand .tagline {
  font-size: 20px;
  color: #999;
  margin-top: 12px;
  letter-spacing: 4px;
}
</style>
</head>
<body>
<div class="top-line"></div>
<div class="product-name">
  <h1>心轮</h1>
  <div class="en">SANDALWOOD · 檀香</div>
</div>
<div class="divider"></div>
<div class="desc">
  <p>奶香与木质交织</p>
  <p>沉稳而温柔</p>
  <p>仿佛走入古老的寺庙</p>
  <p>心，渐渐沉静</p>
</div>
<div class="scent-note">
  <div class="label">香 调</div>
  <div class="notes">前调：乳香 · 中调：檀香 · 尾调：琥珀</div>
</div>
<div class="bottom-brand">
  <div class="logo">InIce</div>
  <div class="tagline">世界本喧，此处冰点</div>
</div>
</body>
</html>
