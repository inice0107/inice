<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  background: #FDFCFA;
  font-family: "Noto Serif SC", "PingFang SC", serif;
  width: 1080px;
  height: 1080px;
  position: relative;
  overflow: hidden;
}
.header {
  position: absolute;
  top: 100px;
  left: 100px;
}
.header h2 {
  font-size: 44px;
  color: #2C2C2C;
  letter-spacing: 8px;
  font-weight: 500;
}
.header .sub {
  font-size: 24px;
  color: #999;
  margin-top: 12px;
  letter-spacing: 4px;
  font-family: "Cormorant Garamond", serif;
}
.chakra-list {
  position: absolute;
  top: 260px;
  left: 100px;
  right: 100px;
}
.chakra-item {
  display: flex;
  align-items: center;
  margin-bottom: 36px;
}
.chakra-color {
  width: 12px;
  height: 12px;
  border-radius: 50%;
  margin-right: 32px;
}
.chakra-name {
  font-size: 28px;
  color: #2C2C2C;
  letter-spacing: 4px;
  flex: 1;
}
.chakra-scent {
  font-size: 22px;
  color: #999;
  letter-spacing: 2px;
  font-family: "Cormorant Garamond", serif;
}
.footer-text {
  position: absolute;
  bottom: 100px;
  left: 100px;
  font-size: 22px;
  color: #C4A882;
  letter-spacing: 6px;
}
</style>
</head>
<body>
<div class="header">
  <h2>七脉轮系列</h2>
  <div class="sub">SEVEN CHAKRAS COLLECTION</div>
</div>
<div class="chakra-list">
  <div class="chakra-item">
    <div class="chakra-color" style="background: #DC143C;"></div>
    <div class="chakra-name">海底轮</div>
    <div class="chakra-scent">Myrrh / 没药</div>
  </div>
  <div class="chakra-item">
    <div class="chakra-color" style="background: #FF8C00;"></div>
    <div class="chakra-name">生殖轮</div>
    <div class="chakra-scent">Nag Champa / 黄兰</div>
  </div>
  <div class="chakra-item">
    <div class="chakra-color" style="background: #FFD700;"></div>
    <div class="chakra-name">脐轮</div>
    <div class="chakra-scent">Devdar / 杜松</div>
  </div>
  <div class="chakra-item">
    <div class="chakra-color" style="background: #32CD32;"></div>
    <div class="chakra-name">心轮</div>
    <div class="chakra-scent">Sandalwood / 檀香</div>
  </div>
  <div class="chakra-item">
    <div class="chakra-color" style="background: #00CED1;"></div>
    <div class="chakra-name">喉轮</div>
    <div class="chakra-scent">Himalayan Cedar / 雪松</div>
  </div>
  <div class="chakra-item">
    <div class="chakra-color" style="background: #4169E1;"></div>
    <div class="chakra-name">眉心轮</div>
    <div class="chakra-scent">Austha Suganda / 苏甘达</div>
  </div>
  <div class="chakra-item">
    <div class="chakra-color" style="background: #9932CC;"></div>
    <div class="chakra-name">顶轮</div>
    <div class="chakra-scent">Frankincense / 乳香</div>
  </div>
</div>
<div class="footer-text">手工制作 · 天然草本</div>
</body>
</html>
